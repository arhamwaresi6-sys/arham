<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in page</title>

    <!-- font family -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Oswald:wght@200..700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
      rel="stylesheet"
    />
    <!-- font family -->
    <!-- icon kit -->
    <script
      src="https://kit.fontawesome.com/ab9e9bc0e3.js"
      crossorigin="anonymous"
    ></script>

    <link rel="stylesheet" href="../css/styles2.css" />
  </head>
  <body>
    <nav class="navbar">
      <h1 class="logo-heading">
        <span class="logo-r">r</span><span class="logo-ong">ong</span>kushol
      </h1>
      <div class="guest-btn"><i class="fa-solid fa-circle-user"></i>guest</div>
    </nav>

    <div class="container">
      <div class="main-container">
        <h2 class="main-heading">sign in</h2>
        <div class="icon-box">
          <i class="fa-brands fa-google" id="google-btn"></i>
          <i class="fa-brands fa-facebook" id="facebook-btn"></i>
          <i class="fa-brands fa-x-twitter" id="x-btn"></i>
        </div>
        <form id="main-form">
          <input
            type="text"
            id="email"
            placeholder="give your Email"
            class="input-btn"
          />
          <input
            type="text"
            id="password"
            placeholder="Password"
            class="input-btn"
          />
          <button type="submit" class="main-btn">login</button>
        </form>
      </div>
      <div class="side-container">
        <h2 class="side-heading">Let's Get You Started!</h2>
        <h4 class="side-subHeading">register here:</h4>
        <button class="sub-btn">sign Up</button>
      </div>
    </div>
    <!-- profile -->

    <script type="module" src="../javascript/login.js"></script>
    <script type="module" src="../javascript/main.js"></script>
  </body>
</html>
