<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/styles4.css" />
    <!-- font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Oswald:wght@200..700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Pattaya&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <!-- font -->
    <!-- icon kit -->
    <script
      src="https://kit.fontawesome.com/ab9e9bc0e3.js"
      crossorigin="anonymous"
    ></script>
    <title>Profile</title>
  </head>
  <body>
    <div class="profile-container">
      <div class="profile-sub-container-1">
        <svg
          viewBox="0 0 200 200"
          xmlns="http://www.w3.org/2000/svg"
          class="blop"
        >
          <path
            fill="#FFffffff"
            class="blop-path"
            d="M43.1,-60.8C56,-50,66.7,-37.6,67.6,-24.4C68.6,-11.2,59.8,2.7,52.7,14.9C45.6,27,40.2,37.5,31.7,45.7C23.2,54,11.6,60,-1.8,62.6C-15.3,65.1,-30.6,64.2,-43.7,57.4C-56.7,50.6,-67.5,38,-72.4,23.4C-77.2,8.8,-76.2,-7.8,-69,-20.1C-61.8,-32.3,-48.4,-40.3,-35.9,-51.2C-23.4,-62.1,-11.7,-76.1,1.7,-78.4C15.1,-80.8,30.2,-71.6,43.1,-60.8Z"
            transform="translate(100 100)"
          />
        </svg>
        <i class="fa-solid fa-arrow-right left-arrow arrow"></i>
        <div class="pro-image-circle">
          <div class="pro-image-container">
            <img
              src="../css/img/defaultpp1.jpg"
              alt="pp1"
              class="profile-image"
            />
            <img
              src="../css/img/defaultpp2.jpg"
              alt="pp2"
              class="profile-image"
            />
            <img
              src="../css/img/defaultpp3.jpg"
              alt="pp3"
              class="profile-image"
            />
          </div>
        </div>
        <i class="fa-solid fa-arrow-right right-arrow arrow"></i>
      </div>

      <div class="profile-sub-container-2">
        <div class="profile-heading">Complete Your Profile!</div>
        <div class="profile-name">Name:</div>
        <input
          type="text"
          class="profile-input"
          placeholder="Write your image"
        />
        <div class="profile-btn">continue</div>
      </div>
    </div>
    <script type="module" src="../javascript/profile.js"></script>
  </body>
</html>
